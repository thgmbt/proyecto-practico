<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171717">
    <title>{% block title %}Ritmos favoritos{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body data-theme="{{ request.endpoint }}">
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}">Miusic<span>+</span></a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a class="nav-home" href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Inicio</a>
        <a class="nav-linkin-park" href="{{ url_for('linkin_park') }}" {% if request.endpoint == 'linkin_park' %}aria-current="page"{% endif %}>Linkin Park</a>
        <a class="nav-maneskin" href="{{ url_for('maneskin') }}" {% if request.endpoint == 'maneskin' %}aria-current="page"{% endif %}>Måneskin</a>
        <a class="nav-red-hot-chili-peppers" href="{{ url_for('red_hot_chili_peppers') }}" {% if request.endpoint == 'red_hot_chili_peppers' %}aria-current="page"{% endif %}>Red Hot Chili Peppers</a>
        <a class="nav-fall-out-boy" href="{{ url_for('fall_out_boy') }}" {% if request.endpoint == 'fall_out_boy' %}aria-current="page"{% endif %}>Fall Out Boy</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Un espacio para descubrir las historias detrás de la música. | creada por Cristhian Urdaneta-</p>
    </footer>
  </body>
</html>
